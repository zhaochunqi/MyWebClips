<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a0ca3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="16" cy="16" r="14" fill="url(#grad)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- 书籍图标 -->
  <rect x="8" y="7" width="16" height="18" rx="1" fill="#ffffff" opacity="0.9"/>
  
  <!-- 书籍页面线条 -->
  <line x1="11" y1="11" x2="21" y2="11" stroke="#4361ee" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="14" x2="19" y2="14" stroke="#4361ee" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="17" x2="21" y2="17" stroke="#4361ee" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="20" x2="17" y2="20" stroke="#4361ee" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 书签 -->
  <rect x="20" y="7" width="2" height="8" fill="#ff6b6b"/>
  <polygon points="20,15 21,13 22,15" fill="#ff6b6b"/>
</svg>